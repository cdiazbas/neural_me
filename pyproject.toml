[build-system]
requires = ["setuptools>=61.0", "wheel", "cython>=0.29", "numpy>=1.20"]
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "neural_me"
version = "0.1.0"
description = "Solar Magnetic Field Inversion using the Milne-Eddington Approximation"
authors = [{ name = "Carlos Diaz", email = "carloskdb@gmail.com" }]
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "astropy>=5.0",
    "matplotlib>=3.7.0",
    "scipy>=1.10.0",
    "einops>=0.6.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
# Solar coordinate / WCS handling for neural_me.core.geometry and
# neural_me.core.coregistration (reproject: the inverse warp). Optional:
# the rotation math works without it, only the WCS-driven helpers need it.
geometry = ["sunpy>=5.0", "reproject"]
# ISPy supplies the Gary & Hagyard reference implementation the geometry
# cross-validation tests check against: https://github.com/ISP-SST/ISPy
dev = [
    "pytest",
    "black",
    "flake8",
    "jupyter",
    "pytest-cov",
    "ipython",
    "sunpy>=5.0",
    "ISPy",
]
cpp = ["cython>=0.29", "numpy>=1.20"]

[project.urls]
"Homepage" = "https://github.com/cdiazbas/neural_me"
"Bug Tracker" = "https://github.com/cdiazbas/neural_me/issues"

[tool.setuptools.packages.find]
where = ["src"]
